# Publications, newest first. The full list on the homepage is grouped by `year`.
#
# Fields
#   id          BibTeX key (unique)
#   title       paper title
#   authors     comma-separated; mark equal contribution with * (e.g. "Didi Zhu*")
#   authors_display  optional shorter author line for very long lists
#   short       optional short name used under the research themes
#   venue       short label shown on the site, e.g. "ICML 2025"
#   venue_full  booktitle / journal used in the generated BibTeX
#   type        conference | workshop | journal | preprint | report
#   year        used to group the full list
#   themes      any of: align, compose, reason, generate (see _data/research.yml)
#   first_author  true if first or co-first author (drives the "First author" filter)
#   role        optional badge: first | cofirst | core
#   role_note   optional text that replaces the default badge text
#   selected    true to feature it under Publications > Selected (first-author papers)
#   project     true to feature it under Projects instead (open model releases)
#   image       figure for selected papers (+ image_w / image_h in pixels, image_alt)
#   tldr        one or two sentences for selected papers
#   arxiv       arXiv id, used for the BibTeX eprint field
#   bibtex_type / howpublished / bib_note   optional BibTeX overrides
#   links       ordered list of {label, url}; the first one is the title link

